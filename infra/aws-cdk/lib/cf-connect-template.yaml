AWSTemplateFormatVersion: "2010-09-09"
Description: "Shipora Cloud Connect — Cross-Account Deployment IAM Role (Level 2 Infrastructure Management)"

Parameters:
  ShiporaAccountId:
    Type: String
    Description: "The Shipora AWS Account ID that is authorized to assume this deployment role."
    Default: "123456789012"
  ExternalId:
    Type: String
    Description: "Unique random security token generated by Shipora to prevent Confused Deputy attacks."
    NoEcho: true
  WebhookUrl:
    Type: String
    Description: "Shipora Webhook URL to automatically notify when the stack creation completes."
    Default: "http://localhost:4000/cloud-connect/aws/webhook"

Resources:
  ShiporaDeploymentRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "ShiporaDeployRole-${ExternalId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${ShiporaAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Tags:
        - Key: "shipora:managed-by"
          Value: "shipora"
      Policies:
        - PolicyName: ShiporaDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ECS Fargate Management
              - Effect: Allow
                Action:
                  - "ecs:RegisterTaskDefinition"
                  - "ecs:DeregisterTaskDefinition"
                  - "ecs:DescribeTaskDefinition"
                  - "ecs:CreateService"
                  - "ecs:UpdateService"
                  - "ecs:DeleteService"
                  - "ecs:DescribeServices"
                  - "ecs:ListTasks"
                  - "ecs:DescribeTasks"
                Resource: "*"
              # ECR Container Registry
              - Effect: Allow
                Action:
                  - "ecr:GetAuthorizationToken"
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:BatchGetImage"
                  - "ecr:PutImage"
                  - "ecr:InitiateLayerUpload"
                  - "ecr:UploadLayerPart"
                  - "ecr:CompleteLayerUpload"
                Resource: "*"
              # CodeBuild
              - Effect: Allow
                Action:
                  - "codebuild:StartBuild"
                  - "codebuild:BatchGetBuilds"
                  - "codebuild:StopBuild"
                Resource: "*"
              # Secrets Manager (Scoped to shipora projects)
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:PutSecretValue"
                  - "secretsmanager:CreateSecret"
                  - "secretsmanager:DeleteSecret"
                Resource: "arn:aws:secretsmanager:*:*:secret:shipora/*"
              # Elastic Load Balancing
              - Effect: Allow
                Action:
                  - "elasticloadbalancing:CreateTargetGroup"
                  - "elasticloadbalancing:DeleteTargetGroup"
                  - "elasticloadbalancing:DescribeTargetGroups"
                  - "elasticloadbalancing:CreateRule"
                  - "elasticloadbalancing:DeleteRule"
                  - "elasticloadbalancing:DescribeRules"
                  - "elasticloadbalancing:ModifyTargetGroup"
                Resource: "*"
              # IAM PassRole for ECS Tasks
              - Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource: "arn:aws:iam::*:role/shipora-*"
              # Level 2 Management: Metrics, Logs & Auto-Scaling
              - Effect: Allow
                Action:
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:ListMetrics"
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "application-autoscaling:*"
                  - "ce:GetCostAndUsage"
                Resource: "*"

Outputs:
  RoleArn:
    Description: "The ARN of the created Shipora deployment role."
    Value: !GetAtt ShiporaDeploymentRole.Arn
    Export:
      Name: !Sub "ShiporaDeployRoleArn-${ExternalId}"
